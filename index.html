function u2b(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
var $=function(i){return document.getElementById(i);};
if(!window.crypto||!crypto.subtle){$("err").textContent="This browser can't decrypt the page (needs HTTPS and a modern browser).";$("go").disabled=true;return;}
if(/[?&]logout\b/.test(location.search)){try{localStorage.removeItem(LS);}catch(e){}history.replaceState(null,"",location.pathname+location.hash);}
function derive(pw){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},k,256);}).then(function(b){return new Uint8Array(b);});}
function decrypt(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(k){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},k,b64(D.ct));}).then(function(p){return new TextDecoder().decode(p);});}
function show(html){document.open();document.write(html);document.close();}
var saved=null;try{saved=localStorage.getItem(LS);}catch(e){}
if(saved){decrypt(b64(saved)).then(show,function(){try{localStorage.removeItem(LS);}catch(e){}});}
$("f").addEventListener("submit",function(e){e.preventDefault();var pw=$("pw").value;$("go").disabled=true;$("err").textContent="";$("go").textContent="Unlocking\u2026";
  var raw;derive(pw).then(function(r){raw=r;return decrypt(r);}).then(function(html){
    if($("rem").checked){try{localStorage.setItem(LS,u2b(raw));}catch(e){}}else{try{localStorage.removeItem(LS);}catch(e){}}
    show(html);
  },function(){$("err").textContent="Wrong password. Try again.";$("go").disabled=false;$("go").textContent="Open dashboard";$("pw").select();});});
})();
